name: Build AeroCine APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Task Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroCine-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to High-Speed Mirrors
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "AeroCine-v1.0.0-debug.apk"

            # 1. Litterbox (Catbox) - Direct Fast Download (No Captcha)
            echo "Uploading APK to Litterbox..."
            LITTER_URL=$(curl -s --max-time 30 -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@AeroCine-v1.0.0-debug.apk" https://litterbox.catbox.moe/resources/internals/api.php)
            echo "Litterbox output: $LITTER_URL"
            if [[ "$LITTER_URL" =~ ^https?:// ]]; then
              echo "================================================="
              echo "DIRECT DOWNLOAD LINK (LITTERBOX): $LITTER_URL"
              echo "================================================="
              echo "### Direct Fast Download (Litterbox)" >> $GITHUB_STEP_SUMMARY
              echo "👉 **[Download AeroCine APK Direct ($LITTER_URL)]($LITTER_URL)**" >> $GITHUB_STEP_SUMMARY
            fi

            # 2. TmpFiles Upload
            echo "Uploading APK to TmpFiles..."
            TMP_RESP=$(curl -s --max-time 45 -F "file=@AeroCine-v1.0.0-debug.apk" https://tmpfiles.org/api/v1/upload)
            TMP_URL=$(echo "$TMP_RESP" | jq -r '.data.url // empty')
            if [ -n "$TMP_URL" ]; then
              echo "TMPFILES DOWNLOAD LINK: $TMP_URL"
              echo "### TmpFiles Direct Mirror" >> $GITHUB_STEP_SUMMARY
              echo "👉 **[Download via TmpFiles ($TMP_URL)]($TMP_URL)**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
